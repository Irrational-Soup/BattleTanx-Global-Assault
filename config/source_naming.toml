[project]
root = ".."
tracked_only = true

[naming]
source_root = "src/code"
layout = "config/us/splat.yaml"
legacy = "config/source_naming_legacy.txt"
vram_delta = 0x80070000
preferred = '^[0-9A-F]{8}_[a-z0-9][a-z0-9_]*\.c$'
exempt_globs = [
  "src/code/libmus/*.c",
  "src/code/n_audio/*.c",
  "src/code/__osGetSR.c",
]
